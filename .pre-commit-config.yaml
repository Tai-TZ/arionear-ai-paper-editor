# Local checks before each commit (same tools and versions as CI).
# Setup once:  pip install -r requirements-dev.txt && pre-commit install
# Run on everything:  pre-commit run --all-files
# LICENSES/ holds verbatim upstream license texts (some have trailing spaces) — never rewrite them.
exclude: ^(\.claude/|frontend/\.claude/|docs/assets/.*\.svg$|frontend/public/latex-stubs/|frontend/src/routeTree\.gen\.ts$|LICENSES/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: (tsconfig.*\.json|\.vscode/.*)$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests|scripts|eval)/
      - id: ruff-format
        files: ^(src|tests|scripts|eval)/

  - repo: local
    hooks:
      - id: frontend-prettier-eslint
        name: frontend · prettier + eslint
        entry: python scripts/precommit_frontend.py
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs|json|css|md)$
        exclude: ^frontend/package-lock\.json$

      # Needs the gitleaks binary on PATH (winget install Gitleaks.Gitleaks / brew install gitleaks).
      - id: gitleaks
        name: gitleaks · staged changes
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
