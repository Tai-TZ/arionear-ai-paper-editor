version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # LaTeX compile can take 30–120s on large manuscripts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/compile/status')",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
