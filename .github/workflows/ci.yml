name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  backend-lint:
    name: Backend · lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff (version pinned in requirements-dev.txt)
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Ruff check
        run: ruff check src tests scripts eval

      - name: Ruff format check
        run: ruff format --check src tests scripts eval

  backend-test:
    name: Backend · test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: >
          pytest tests -q -p no:cacheprovider
          --cov=src --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Coverage summary
        if: matrix.python == '3.11'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate", 0)) * 100
          print(f"### Backend coverage: {rate:.1f}% of lines")
          PY

      - name: Upload coverage report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Database · Prisma migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edico
          POSTGRES_PASSWORD: edico
          POSTGRES_DB: edico
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edico" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://edico:edico@localhost:5432/edico
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Prisma CLI
        run: npm ci

      - name: Validate schema
        run: npx prisma validate

      - name: Apply all migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Schema and migrations are in sync
        env:
          SHADOW_DATABASE_URL: postgresql://edico:edico@localhost:5432/edico_shadow
        run: |
          PGPASSWORD=edico psql -h localhost -U edico -d edico -c "CREATE DATABASE edico_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
