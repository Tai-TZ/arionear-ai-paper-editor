name: Docker

# Builds both images and smoke-tests the containers. Nothing is pushed — there is no deployment.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - src/**
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker.yml
  schedule:
    - cron: "41 4 * * 1" # weekly — base images and apt packages drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend image (FastAPI + TeX Live)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: arionear-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=production \
            -e AUTH_SECRET_KEY="$(openssl rand -hex 32)" \
            -e LLM_PROVIDER=openai -e OPENAI_API_KEY=ci-placeholder \
            arionear-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          echo
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          # TeX Live must be usable inside the image for PDF compile
          curl -fsS http://localhost:8000/api/v1/compile/status | tee status.json
          grep -q '"available":true' status.json

      - name: Container logs
        if: always()
        run: docker logs api || true

  frontend:
    name: Frontend image (TanStack Start / Nitro)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: arionear-web:ci
          build-args: VITE_API_URL=http://localhost:8000/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:8080 arionear-web:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -qi "<html"

      - name: Container logs
        if: always()
        run: docker logs web || true
