# Cloud Build config for the Proofline frontend.
# VITE_API_URL is baked into the client bundle at build time — it must match the
# backend custom domain so the browser hits the correct API origin.
#
# Usage (from repo root or frontend/):
#   gcloud builds submit --config=frontend/cloudbuild.yaml \
#     --substitutions=_VITE_API_URL=https://api.proofline.example/api/v1,_IMAGE=asia-east1-docker.pkg.dev/project-f8474886-b777-42fc-88c/proofline/frontend:latest
#
# Default substitution value covers the production custom domain — override only
# when targeting a different environment (staging, local Cloud Run URL, etc.).

substitutions:
  _VITE_API_URL: https://api.proofline.example/api/v1
  _IMAGE: asia-east1-docker.pkg.dev/project-f8474886-b777-42fc-88c/proofline/frontend:latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

timeout: 1800s
